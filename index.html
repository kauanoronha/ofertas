<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo de Ofertas Lojão Total</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-red: #A6192E;
            /* Vermelho escuro inspirado na sua logo */
            --brand-red-light: #D32F2F;
            --brand-white: #ffffff;
            --whatsapp-green: #25D366;
            --bg-color: #f8f9fa;
            --text-main: #1c1e21;
            --text-muted: #65676b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* Fundo da página com degradê em tons de vermelho */
        body {
            background-color: var(--brand-red);
            background-image: linear-gradient(135deg, var(--brand-red) 0%, #7A0C16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Cartão branco central */
        .container {
            background-color: var(--brand-white);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease-out;
            border-top: 6px solid var(--brand-red-light);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Container da Logo */
        .logo-wrapper {
            margin: 0 auto 24px;
            max-width: 240px;
            height: auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        h1 {
            color: var(--brand-red);
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        p {
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: var(--whatsapp-green);
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 18px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .btn-whatsapp:hover {
            background-color: #1DA851;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp i {
            font-size: 22px;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .secure-badge i {
            color: var(--brand-red-light);
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- A logo será exibida aqui. Certifique-se de salvar a imagem como 'logo.png' na mesma pasta -->
        <div class="logo-wrapper">
            <img src="https://ofertas.lojaototal.com.br/logo.png" alt="Lojão Total"
                onerror="this.style.display='none'; this.parentElement.innerHTML='<h2 style=\'color: var(--brand-red); margin-bottom: 20px;\'>Lojão Total</h2>'">
        </div>

        <h1>Grupo de ofertas Lojão Total</h1>



        <!-- Substitua o link abaixo pelo link real do seu grupo -->
        <a href="https://chat.whatsapp.com/FUZ5cMcsZLsCCvCo7hcFM8?mode=gi_t" class="btn-whatsapp" target="_blank"
            rel="noopener noreferrer">
            <i class="fab fa-whatsapp"></i>
            Entrar no Grupo
        </a>

        <div class="secure-badge">
            <i class="fas fa-lock"></i>
            <span>Acesso 100% seguro e oficial</span>
        </div>
    </div>

</body>

</html>
